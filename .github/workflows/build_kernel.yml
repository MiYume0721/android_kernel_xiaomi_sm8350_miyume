name: Build Xiaomi SM8350 Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device'
        required: true
        default: 'venus'
        type: choice
        options:
          - venus
          - star
          - haydn
          - all
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'Documentation/**'

jobs:
  build:
    name: Build Kernel for ${{ matrix.device }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.device == 'all' && fromJSON('["venus", "star", "haydn"]') || fromJSON(format('["{0}"]', github.event.inputs.device))) || fromJSON('["venus"]') }}

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev python3 \
            dwarves zip curl git ccache lld-18 llvm-18 clang-18 binutils-aarch64-linux-gnu
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-18 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-18 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-18 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-18 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-18 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-readelf-18 /usr/bin/llvm-readelf
          sudo ln -sf /usr/bin/llvm-strip-18 /usr/bin/llvm-strip

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.device }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.device }}-
            ccache-

      - name: Configure ccache & Toolchain Wrappers
        run: |
          mkdir -p ~/.cache/ccache
          mkdir -p ~/.ccache_bin
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --set-config=sloppiness=time_macros,include_file_mtime,file_macro
          
          # Create compiler wrappers so clang transparently uses ccache
          cat << 'EOF' > ~/.ccache_bin/clang
          #!/bin/bash
          exec ccache /usr/bin/clang-18 "$@"
          EOF
          cat << 'EOF' > ~/.ccache_bin/clang++
          #!/bin/bash
          exec ccache /usr/bin/clang++-18 "$@"
          EOF
          chmod +x ~/.ccache_bin/*
          echo "$HOME/.ccache_bin" >> $GITHUB_PATH

      - name: Ensure BakaSU 5.4 Compatibility
        run: |
          if [ -d "KernelSU" ] && [ -f "patches/bakasu_5.4_compat.patch" ]; then
            cd KernelSU
            git apply --check ../patches/bakasu_5.4_compat.patch 2>/dev/null && git apply ../patches/bakasu_5.4_compat.patch && echo "Applied 5.4 compatibility patch to KernelSU" || echo "KernelSU already has compatibility patch applied"
            cd ..
          fi

      - name: Verify Toolchain & Initial Cache
        run: |
          clang --version
          ld.lld --version
          ccache -s
          ccache -z

      - name: Build Kernel Image
        run: |
          DEVICE="${{ matrix.device }}"
          echo "=== Building Kernel for $DEVICE with incremental ccache ==="
          bash build_device.sh "$DEVICE"

      - name: Show ccache Statistics
        if: always()
        run: |
          ccache -s

      - name: Package with AnyKernel3
        run: |
          DEVICE="${{ matrix.device }}"
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/anykernel.sh AnyKernel3/README.md AnyKernel3/.git*

          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=MiYume Kernel for Xiaomi SM8350
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=venus
          device.name2=star
          device.name3=haydn
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          # boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          split_boot;
          flash_boot;
          ## end boot install
          EOF

          IMAGE_PATH="out_${DEVICE}/arch/arm64/boot/Image"
          if [ -f "$IMAGE_PATH" ]; then
            cp "$IMAGE_PATH" AnyKernel3/Image
            cd AnyKernel3
            zip -r9 "../AnyKernel3-MiYume-${DEVICE}-${{ github.run_number }}.zip" * -x .git README.md *placeholder
            cd ..
            echo "Package built successfully!"
          else
            echo "ERROR: Kernel Image not found at $IMAGE_PATH"
            exit 1
          fi

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image-${{ matrix.device }}-${{ github.run_number }}
          path: out_${{ matrix.device }}/arch/arm64/boot/Image

      - name: Upload AnyKernel3 Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-MiYume-${{ matrix.device }}-${{ github.run_number }}
          path: AnyKernel3-MiYume-${{ matrix.device }}-*.zip
